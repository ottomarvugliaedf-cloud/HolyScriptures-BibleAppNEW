name: Build HolyScriptures APK Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install deps + CLI
      run: |
        rm -f package-lock.json
        npm install --legacy-peer-deps
        npm install @react-native-community/cli --no-save
        
    - name: Create bundle
      run: |
        mkdir -p android/app/src/main/assets
        npx @react-native-community/cli bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
        
    - name: Setup Java & Android
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: android-actions/setup-android@v3
      
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HolyScriptures-APK-Final.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
